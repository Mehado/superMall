# ============================================================
# superMall 一键部署（MySQL + Redis + RabbitMQ + 两个后端 + Nginx）
# ------------------------------------------------------------
# 用法（**一条命令**，宿主机不需要装 JDK / Maven / Node）：
#   1) 复制环境变量：  cp deploy/.env.example .env  然后填 JASYPT_ENCRYPTOR_PASSWORD
#   2) 启动：          docker compose up -d --build
#   3) 访问：          http://localhost             （前端，Nginx 单端口）
#                      http://localhost:8080/doc.html（外卖 Knife4j，可用 TAKEOUT_HOST_PORT 改）
#                      http://localhost:8081/doc.html（电商 Knife4j，同上）
#                      http://localhost:15672        （RabbitMQ 控制台 guest/guest）
#
# ⚠️ 端口冲突：本机若已经装了 MySQL / Redis / RabbitMQ（占 3306 / 6379 / 5672），
#    直接 up 会「端口被占用」起不来 —— 在 .env 里改 `*_HOST_PORT`（例如 13306）即可，
#    容器之间仍走服务名内网端口，不受影响。
#
# ⚠️ 数据库 / Redis 的密码是【jasypt 加密写死在 yml 里】的，解密值必须与本文件的环境变量
#    一致（默认 MYSQL_ROOT_PASSWORD=Ming1234 / REDIS_PASSWORD=mehado）。改了就要重新加密：
#    `mvn -N jasypt:encrypt-value -Djasypt.plugin.value="新密码"`。
#
# ⚠️ 演示图在 OSS（DB 里存的是绝对 URL），容器需要能出网访问 OSS，否则页面图全是灰占位。
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: supermall-mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Ming1234}
      MYSQL_DATABASE: supermall
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建表 + 种子数据（01 外卖 → 02 电商 → 03 电商演示数据；三个脚本都幂等）
      # 03 是 69 个带图演示商品（图在 OSS，DB 里是绝对 URL）；不想要演示数据就删掉这一行
      - ./sql/supermall.sql:/docker-entrypoint-initdb.d/01-supermall.sql:ro
      - ./sql/mall.sql:/docker-entrypoint-initdb.d/02-mall.sql:ro
      - ./sql/seed-mall-demo.sql:/docker-entrypoint-initdb.d/03-seed-mall-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:5.0-alpine
    container_name: supermall-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-mehado}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-mehado}
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: supermall-rabbitmq
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_CONSOLE_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # 外卖后端 :8080
  takeout:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      args:
        MODULE: superMall-takeout
    container_name: supermall-takeout
    environment:
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD:?请在 .env 里设置 JASYPT_ENCRYPTOR_PASSWORD}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: supermall
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${TAKEOUT_HOST_PORT:-8080}:8080"
    restart: unless-stopped

  # 电商后端 :8081
  mall:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      args:
        MODULE: superMall-mall
    container_name: supermall-mall
    environment:
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD:?请在 .env 里设置 JASYPT_ENCRYPTOR_PASSWORD}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: supermall
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${MALL_HOST_PORT:-8081}:8081"
    restart: unless-stopped

  # 前端（Nginx 单端口：静态资源 + /api 按板块反代）
  # 前端在**容器内构建**（Node 多阶段 → Nginx），所以宿主机不用装 Node。
  # 想用宿主机已构建的 dist（改前端后更快）就把下面两行换成：
  #   image: nginx:1.27-alpine
  #   volumes: [./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro, ./frontend/dist:/usr/share/nginx/html:ro]
  nginx:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    image: supermall-frontend:latest
    container_name: supermall-nginx
    depends_on:
      - takeout
      - mall
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    restart: unless-stopped

volumes:
  mysql-data:
