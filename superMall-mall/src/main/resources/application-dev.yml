super-mall:
  # 与外卖共用同一个 MySQL 实例、同一个库（共享 sys_user / address）
  # 敏感项（账号/密码）以 jasypt ENC(...) 密文写入；主机端口等非敏感项仍可用环境变量覆盖
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: ${MYSQL_HOST:localhost}
    port: ${MYSQL_PORT:3306}
    database: ${MYSQL_DATABASE:supermall}
    username: ENC(TVygDk/xxhwWvwCmXiPw1CzUiqaM/xvkrZDV5ZP/JDLQ5uZqKHoULYov9oohP5Sj)
    password: ENC(RSDz2yd57hAhPawr/9GzJddm5cnMDHGMLUR7GfPl3CWRRUyARAGScKMv47NdqCKi)
  # 与外卖共用同一个 Redis 实例（key 前缀不同，互不干扰）
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    password: ENC(lmmR1cnw58eFKaqbfFUPeH/SunpmVWneCHapWZ/rmF7kQu1LwoaeDlqiBkICd6hZ)
  # 电商 P0/P1 不需要 MQ；P4（超时关单）才会加自己的 mall.* exchange/queue，
  # 且命名不会与外卖的 order.* / pay.* 重名 —— 重名会导致两个服务抢消息。
