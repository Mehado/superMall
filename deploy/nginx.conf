# ============================================================
# superMall Nginx 配置（前端静态资源 + /api 按板块反代）
# ------------------------------------------------------------
# 挂载到容器：/etc/nginx/conf.d/default.conf
# 静态根目录：/usr/share/nginx/html（对应宿主机的 frontend/dist）
#
# 板块隔离靠前缀：
#   /api/mall/**  → 电商后端 8081
#   /api/**       → 外卖后端 8080
# 注意：更长前缀的 location 必须写在前面（/api/mall/ 在 /api/ 之前）。
# ============================================================

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip 静态资源
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带 hash 的构建产物可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 电商后端（更长的前缀放前面） ----------
    location /api/mall/ {
        proxy_pass http://mall:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 外卖后端 ----------
    location /api/ {
        proxy_pass http://takeout:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 外卖商品图片（若不走 OSS 而走本地静态目录时用）
    location /img/ {
        proxy_pass http://takeout:8080;
        proxy_set_header Host $host;
    }

    # ---------- 前端 ----------
    # 默认：外卖前端 frontend（Vue Router history 模式 → 回退到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
