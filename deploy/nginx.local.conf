# ============================================================
# superMall 本地 Nginx 配置（Windows，不用 Docker）
# ------------------------------------------------------------
# 使用方法：把本文件放到 nginx 的 conf 目录，并在 conf/nginx.conf 的 http {} 里加一行
#     include supermall.conf;
# 然后：
#     nginx -t           # 校验
#     start nginx        # 启动（或 nginx -s reload 重载）
#
# 本机实际部署路径：D:\nginx\nginx-1.26.3\conf\supermall.conf
# 端口 80 被占用时改 listen 即可。
# ============================================================

server {
    listen       80;
    server_name  localhost;

    charset utf-8;
    # 前端：frontend 的构建产物（先在 frontend 目录执行 npm run build）
    root   "F:/path/to/superMall/frontend/dist";
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 电商后端（更长前缀必须写在 /api/ 前面）
    location /api/mall/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 外卖后端
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /img/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # 前端 SPA（vue-router history 模式 → 回退 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
