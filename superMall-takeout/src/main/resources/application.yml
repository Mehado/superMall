server:
  port: 8080

spring:
  application:
    name: superMall-takeout
  profiles:
    active: dev
  main:
    allow-circular-references: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: ${super-mall.datasource.driver-class-name}
    url: jdbc:mysql://${super-mall.datasource.host}:${super-mall.datasource.port}/${super-mall.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${super-mall.datasource.username}
    password: ${super-mall.datasource.password}
    druid:
      initial-size: 5
      min-idle: 10
      max-active: 20
      max-wait: 60000

  jackson:
    date-format: yyyy-MM-dd HH:mm
    time-zone: Asia/Shanghai

  data:
    redis:
      host: ${super-mall.redis.host}
      port: ${super-mall.redis.port}
      database: ${super-mall.redis.database}
      password: ${super-mall.redis.password}

  rabbitmq:
    host: ${super-mall.rabbitmq.host}
    port: ${super-mall.rabbitmq.port}
    username: ${super-mall.rabbitmq.username}
    password: ${super-mall.rabbitmq.password}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual

mybatis:
  # Mapper XML 位置
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.supermall.takeout.entity,com.supermall.entity
  configuration:
    # 下划线列名自动映射驼峰属性
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      supermall:
        mapper: debug
        service: info
        controller: info

springdoc:
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.supermall.takeout.controller
  default-produces-media-type: application/json

knife4j:
  enable: true
  setting:
    language: zh_cn

super-mall:
  jwt:
    # 三个端各自独立密钥（ENC 密文，明文为 >=32 字节的随机串，HS256）
    user-secret-key: ENC(E6xU9um8858gVSngJ4Ij7QNsF7GT6IJura9p2KMo7vYaMWpIvEOQk+Tj/LmMbbhVxHfq0gQxLflK4fOJsmCk+zPMgNJULtKV8MHjlkPXNDE=)
    user-ttl: 7200000
    user-token-name: token
    merchant-secret-key: ENC(FaJuAU+cgctbZgJfIkJ8MojG2jJ8y126lBv/U68ei8iK0EXFHQ7dJTXo/pytqnmC/1nq+me/Hs51wvy/hPU+Wi7SysOqvoe72BxfORfIG2E=)
    merchant-ttl: 7200000
    merchant-token-name: merchant-token
    delivery-secret-key: ENC(K6ovistJ0xaj1yiYBaIrA5nPB9Y20krhxPhWuvbO/admaZHXxXu1OR5L0isxXw2hFeG6GWTW+CbS36sw+e4IHQcxIQ12vMz4VqaYWh1g04c=)
    delivery-ttl: 7200000
    delivery-token-name: delivery-token
    # 平台运营（外卖）：审核商家入驻 / 管理骑手
    platform-secret-key: ENC(DYcZ1ZJg9iztBIpdPo+h0Qi2r4ByHsIg8OPt/AGrjHDtQCv0oumcDGBtvmogzgQXSb0Mb9K/nzmBQ3S/3JstcaUwPLrowNoMP5mjXhNBT20=)
    platform-ttl: 7200000
    platform-token-name: platform-token
  delivery:
    # 每单配送费
    base-fee: 3.00
    # 订单支付超时时间（分钟），与 RabbitMQ 延迟队列 TTL 保持一致
    pay-timeout-minutes: 15
  # 图形验证码（防机器人）
  captcha:
    # true = 三个端的登录与注册都强制校验（默认）。
    # 压测/自动化可临时置 false 跳过；关了就等于关掉防刷，只在测试环境用。
    enabled: true
    # 有效期（秒），同时也是 Redis key 的 TTL
    ttl-seconds: 120
    length: 4
    width: 132
    height: 44
    key-prefix: "captcha:"
    # 需要放行企业邮箱时追加域名（逗号分隔），会并入内置常用后缀清单
    email-extra-domains: ""
  # 账号与密码规则：邮箱后缀白名单的内置清单在 EmailDomains 里，这里只做追加
  validation:
    email-extra-domains: ""
  # 阿里云 OSS：商品图片存 OSS，方便项目转移
  alioss:
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ENC(N6z3T8k5OhLLAnoRCesaPypO2AITUiJFhol8S98cX1yetCJva4Y3D/frkgss5LdEDAiR6JL9kP7VbXkWdWvUwA==)
    access-key-secret: ENC(BPRPYvvZ6d6pQUauGmUezgcTRwQX+8qwaUbqaQ+iZslgAfwdh7XEIKwwcobvnU9qV/zsc80nRs6is6Fzojifnw==)
    bucket-name: ${OSS_BUCKET:mehado-java}
    dir: supermall/products/
    # 头像目录（买家上传头像用，与商品图分开）
    avatar-dir: supermall/avatars/

# 配置加密：主密码只从环境变量读取，yml 里不出现明文
jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}
    algorithm: PBEWITHHMACSHA512ANDAES_256
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
